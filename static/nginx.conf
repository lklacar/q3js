worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        listen [::]:8080;
        root /data;

        etag on;
        max_ranges 1;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /cpma/manifest.json {
            if ($request_method = OPTIONS) {
                return 204;
            }

            alias /tmp/q3js-cpma-manifest.json;
            default_type application/json;
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "If-None-Match, If-Modified-Since" always;
            add_header Access-Control-Expose-Headers "Content-Length, ETag" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ~ ^/(baseq3|cpma)/[A-Za-z0-9][A-Za-z0-9._-]*\.pk3$ {
            if ($request_method = OPTIONS) {
                return 204;
            }

            try_files $uri =404;
            gzip off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            return 404;
        }
    }
}
